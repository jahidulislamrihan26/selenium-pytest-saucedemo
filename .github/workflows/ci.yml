name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # nightly: the public site can change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Selenium tests (Chrome, headless)
        run: python -m pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selenium-report
          path: reports
          if-no-files-found: ignore
